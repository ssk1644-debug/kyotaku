<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アスポッピー営業ナビ</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0d6e62">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
</head><body>
<style>
/* Layout: 上部に現在地バー、中央に居宅カルテ（CMカード→利用者→記録）、下部に固定タブ。iPadでは2列。 */
:root{
  --todo:#c75000; --todo-soft:#fdebd8;
  --bg:#f3f5f4; --surface:#ffffff; --line:#d9dfdc; --ink:#1c2826; --muted:#5d6c68;
  --accent:#0d6e62; --accent-soft:#dcefeb; --notice:#9a5b00; --notice-soft:#fbefd9;
  --alert:#b3261e; --alert-soft:#f9e1de;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --todo:#f5a142; --todo-soft:#3b2812;
  --bg:#121816; --surface:#1b2321; --line:#2e3a37; --ink:#e4ece9; --muted:#9aaba6;
  --accent:#4cc2b1; --accent-soft:#16332e; --notice:#f0b458; --notice-soft:#3a2c14;
  --alert:#ff8a80; --alert-soft:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --todo:#f5a142; --todo-soft:#3b2812;
  --bg:#121816; --surface:#1b2321; --line:#2e3a37; --ink:#e4ece9; --muted:#9aaba6;
  --accent:#4cc2b1; --accent-soft:#16332e; --notice:#f0b458; --notice-soft:#3a2c14;
  --alert:#ff8a80; --alert-soft:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 110px}
body.wide .wrap{max-width:none;padding-left:28px;padding-right:28px}
.pill[hidden]{display:none}
.rt{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}.rt th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:700;padding:6px;border-bottom:2px solid var(--line);white-space:nowrap}.rt td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}.rt tr:hover td{background:var(--accent-soft);cursor:pointer}
.rtw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.ac{display:inline-block;border-radius:6px;padding:1px 7px;font-weight:700;font-size:12.5px}.ac.ok{color:#1e8449}.ac.na{color:var(--muted);font-weight:400}.ac.o{background:#fdebd8;color:#b35400}.ac.r{background:#fadbd8;color:#b03a2e}.ac.h{background:#f4ecf7;color:#8e44ad}.ac.w{color:var(--ink);font-weight:400}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.bcol{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}.bcol h3{font-size:17px;margin-bottom:6px}.bitem{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:6px 2px;font:inherit;color:inherit;cursor:pointer}.bitem:hover{background:var(--accent-soft)}
.chatbtn{position:relative;font-size:18px;padding:6px 12px}.chatbtn .tbadge{position:absolute;top:-4px;right:-4px}
.chl{display:flex;flex-direction:column;gap:6px}.chl button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;cursor:pointer}.chl .cnt{background:var(--alert);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.chat{display:flex;flex-direction:column;gap:6px;margin:8px 0 10px}.chat .msg{max-width:85%}.chat .msg.me{align-self:flex-end}.urgn{border-left-color:var(--alert)!important}.msg.urg{border:2px solid var(--alert);background:var(--alert-soft)}
.alarm{position:fixed;inset:0;z-index:20;background:rgba(176,58,46,.96);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}.alarm .pp{width:110px;height:110px;animation:ppBob .5s ease-in-out infinite}.alarm .t{font-size:22px;font-weight:800;white-space:pre-wrap;max-width:640px}.alarm .btn{font-size:18px;padding:12px 22px;color:var(--ink)}.alarm .btn.primary{color:#fff}
.thr{border-left:4px solid var(--accent);border-radius:10px;background:var(--accent-soft);padding:4px 0 4px 6px;margin:4px 0}.thr-h{font-size:13px;font-weight:700;color:var(--accent);padding:2px 6px}.thr .rrow+.rrow{margin-left:14px}
.rfl{display:flex;flex-direction:column;gap:6px;margin:10px 0 6px}.rfs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--surface)}.rfs.on{border-color:#1e8449;background:#eefaf3}.rfb{flex:1;min-width:200px;display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:6px 2px;font-size:17px;color:var(--ink);cursor:pointer}.rfc{flex:none;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line);font-weight:800;color:var(--muted)}.rfs.on .rfc{background:#1e8449;border-color:#1e8449;color:#fff}.rfx{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.rfx .sim{max-width:170px}
.tgl{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:700;min-width:70px}.tgl.on{border-color:#1e8449;background:#d5f5e3;color:#1e8449}
.num{font-variant-numeric:tabular-nums}

/* 現在地バー */
.locbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.locbar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.backbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.brand{font-family:var(--f-display);font-weight:700;font-size:16px;margin-right:auto}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pill.off .dot{background:var(--alert)}
select.sim{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;max-width:100%}

/* 到着バナー */
.arrive{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent);color:var(--surface);padding:12px 16px;border-radius:12px;margin:12px 0}
.arrive b{font-family:var(--f-display);font-size:17px}
.arrive .btn{background:var(--surface);color:var(--accent);border:0}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:active,.tab:active,.oitem:active{transform:scale(.96);filter:brightness(.9)}
.btn:disabled{opacity:.6}
.bkrow{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.bkrow.on{background:var(--alert-soft);border-color:var(--alert);color:var(--alert);font-weight:700}
.bkrow input{width:22px!important;height:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:700}.seg button.on{background:var(--accent);color:var(--surface)}
.flash{white-space:pre-line;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;background:var(--accent);color:#fff;font-size:26px;font-weight:700;padding:22px 30px;border-radius:18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);pointer-events:none;max-width:90vw}
.flash.rec{background:#c0392b}.flash.stop{background:#34495e}
#map{height:62vh;min-height:320px;border-radius:12px;border:1px solid var(--line);z-index:1}
.jk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.jk .form{gap:6px}

/* 居宅ヘッダ */
.ohead{padding:14px 0 6px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end}
.ohead h1{font-size:22px}
.meta{color:var(--muted);font-size:13px}
.section-t{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.section-t h2{font-size:16px}
.section-t .meta{margin-left:auto}
.section-t{flex-wrap:wrap}

/* 連絡事項 */
.notices{display:grid;gap:8px}
.notice{background:var(--notice-soft);border-left:4px solid var(--notice);padding:10px 12px;border-radius:6px}
.notice .from{font-size:12px;color:var(--notice);font-weight:700}

/* CM */
.cms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cm.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cm-top{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.cm h3{font-size:17px}
.kana{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:3px 8px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.last{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px}
.last .meta{font-size:11.5px}

/* 利用者 */
.clients{display:grid;gap:8px}
.client{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.client .nm{font-weight:700}
.status{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;align-self:start;white-space:nowrap}
.st-ok{background:var(--accent-soft);color:var(--accent)}
.st-warn{background:var(--notice-soft);color:var(--notice)}
.st-alert{background:var(--alert-soft);color:var(--alert)}
.client .recent{grid-column:1/-1;font-size:13.5px}
.client .items{grid-column:1/-1;font-size:12.5px;color:var(--muted)}

/* 記録フォーム */
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px;width:100%}
.form textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.log{display:grid;gap:8px}
.logi{border-left:3px solid var(--line);padding:3px 0 3px 10px;font-size:16px;line-height:1.5}
.logi .meta{font-size:14px}

/* 一覧 */
.olist{display:grid;gap:8px}
.oitem{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.oitem .dist{margin-left:auto;font-weight:700;color:var(--accent);white-space:nowrap}
.oitem .t{min-width:0}
.oitem .t b{display:block;font-family:var(--f-display)}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--notice-soft);color:var(--notice);font-weight:700;margin-left:4px}

/* 名刺 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.bcard .ph{aspect-ratio:91/55;max-width:100%;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:12px}
.bcard .ph img{width:100%;height:100%;object-fit:cover}
.bcard .bd{padding:10px 12px;font-size:13.5px;display:grid;gap:2px}
.bcard .bd b{font-size:15.5px;font-family:var(--f-display)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px;font-size:15px}
.prev{max-width:260px;border-radius:8px;border:1px solid var(--line)}

/* タブ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:flex}.tabs-in .tab{flex:1 1 0;min-width:0;position:relative;white-space:nowrap;font-size:12px;letter-spacing:-.02em;padding-left:0;padding-right:0}.tabs-in .tab[hidden]{display:none}
.tbadge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--alert);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}
.tab{background:none;border:0;padding:10px 4px 12px;font-size:12.5px;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:#fff;font-weight:700;background:#c0392b;border-radius:12px;box-shadow:0 2px 6px rgba(192,57,43,.35)}
.empty{padding:30px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:9}
.scan{display:flex!important;flex-direction:row;align-items:center;gap:14px;padding:16px;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);color:var(--accent)!important;cursor:pointer}
.scan b{font-size:16px;font-family:var(--f-display)}
.progress{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

@media all{
.pp{display:inline-block;width:28px;height:28px;border-radius:50%;background:#fff center/contain no-repeat;flex-shrink:0;vertical-align:middle}
.spin{width:30px;height:30px;border:0;border-radius:50%;background:#fff var(--pp-think) center/contain no-repeat;box-shadow:0 0 0 1px var(--line);animation:ppSway 1.6s ease-in-out infinite;vertical-align:middle;flex-shrink:0}
@keyframes ppSway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.empty::before{content:"";display:block;width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:#fff var(--pp-sleep) center/contain no-repeat;animation:ppBreath 3.2s ease-in-out infinite}
.pp-night .empty::before{background-image:var(--pp-deep)}
@keyframes ppBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.toast{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;max-width:92vw}
.toast .pp{width:36px;height:36px;animation:ppPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes ppPop{0%{transform:scale(.3) translateY(8px)}100%{transform:none}}
}
.pphead{display:flex;align-items:center;position:relative;cursor:pointer;flex-shrink:0}.pphead .say{display:none}.pphead .pp{width:38px;height:38px;box-shadow:0 0 0 2px var(--accent-soft)}
.pphead .ppdot{position:absolute;top:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--alert);border:2px solid var(--surface)}
.pphead.tap .pp{animation:ppPop .45s cubic-bezier(.3,1.6,.5,1)}
@media (min-width:768px) and (min-height:600px){
.pphead .say{display:block}.pphead .ppdot{display:none}
.brand{margin-right:0}
.pphead{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0;cursor:default}
.pphead .pp{width:52px;height:52px;box-shadow:0 0 0 2px var(--accent-soft);animation:ppBob 3.4s ease-in-out infinite}
.pphead .say{position:relative;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:6px 12px;font-size:13.5px;line-height:1.45;max-width:440px}
.pphead .say::before{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right-color:var(--accent-soft)}
.pphead .say b{color:var(--accent)}
.spin{width:38px;height:38px}
.toast .pp{width:46px;height:46px}
.empty::before{width:110px;height:110px}
}
@keyframes ppBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.hst td{padding:3px 4px}.hst input,.hst select{font-size:13px;padding:5px 6px;min-height:0}.hst input[type=date]{width:128px}.hst td:nth-child(2) input{min-width:96px!important;width:110px}.hst td:nth-child(3) input{min-width:130px!important;width:150px}
.ctree{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}.ctree-h{display:flex;gap:8px;align-items:baseline;font-size:17px}
ul.tree{list-style:none;margin:6px 0 0 6px;padding:0}ul.tree li{position:relative;padding:5px 0 5px 20px;font-size:14px}
ul.tree li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}ul.tree li:last-child::before{bottom:auto;height:19px}

function toServer(t,r){r=Object.assign({},r);

async function persist(ops){

/* どの保存でも、上に「保存中…」→「✓ 保存しました」を出す（押したのが分かるように） */
let SAVE_N=0,SAVE_T=null;function saveInd(st){let el=$("#saveInd");if(!el){el=document.createElement("div");el.id="saveInd";el.className="saveind";document.body.appendChild(el)}

/* ===== すぐ保存（11/10 レスポンス改善 第1段階）
   押した瞬間にこの端末のデータと画面を変え、サーバーへの保存は裏で行う。
   同じ行への連続変更は1つにまとめ、最後の内容を順番どおりに保存。失敗は3回まで自動でやり直し、だめなら赤い帯で知らせる。
   新規作成・削除・取り込み・通知は、これまでどおり persist（完了を待つ）を使う。 ===== */
const SQ={};
const sqKeys=()=>Object.keys(SQ);
const sqFailN=()=>sqKeys().filter(k=>SQ[k].fail).length;
function sqInd(){const busy=sqKeys().some(k=>!SQ[k].fail);if(busy)saveInd("busy");else if(!SAVE_N)saveInd(sqFailN()?"":"ok");
 let bar=document.getElementById("sqBar");const n=sqFailN();
 if(!n){if(bar)bar.remove();return}
 if(!bar){bar=document.createElement("div");bar.id="sqBar";bar.style.cssText="position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:9001;background:#b3261e;color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)";document.body.appendChild(bar)}

function sqReapply(t,id){const k=t+":"+id,q=SQ[k];if(!q)return;const ex=(DB[t]||[]).find(x=>x.id===id);if(ex){const u=ex.updatedAt;Object.assign(ex,q.row);if(u!=null)ex.updatedAt=u}}
async function sqSend(k){const q=SQ[k];if(!q||q.busy)return;q.busy=true;q.fail=false;sqInd();const seq=q.seq,t=q.table,row=Object.assign({},q.row);let again=false;
 try{if(MODE==="live"){const ex=(DB[t]||[]).find(x=>x.id===row.id),sr=toServer(t,row);if(ex&&ex.updatedAt!=null)sr._base=ex.updatedAt;
   const d=await api("batch",{ops:[{table:t,row:sr}]});const v=fromServer(t,d.rows[0]);
   if(SQ[k]===q&&q.seq===seq){applyOp(t,v);delete SQ[k]}else{const e=(DB[t]||[]).find(x=>x.id===row.id);if(e&&v&&v.updatedAt!=null)e.updatedAt=v.updatedAt;again=true}
   cacheSoon()}
  else{save();if(q.seq===seq)delete SQ[k];else again=true}
  q.tries=0}
 catch(e){if(e&&e.code==="conflict"){delete SQ[k];toast("ほかの人が先に変えていました。最新の内容にします");syncNow("quiet")}
  else{q.tries=(q.tries||0)+1;if(q.tries<=3){q.busy=false;setTimeout(()=>sqSend(k),1000*Math.pow(2,q.tries));sqInd();return}q.fail=true}}
 q.busy=false;sqInd();if(again&&SQ[k])sqSend(k)}
/* ops：[{table,row}]（どれも id で上書きする行）。すぐ画面を変えて、保存は裏で */
function saveFast(ops,msg){ops.forEach(o=>{applyOp(o.table,Object.assign({},o.row));const k=o.table+":"+o.row.id,q=SQ[k]||(SQ[k]={table:o.table,row:{},seq:0,tries:0});Object.assign(q.row,o.row);q.seq++;q.tries=0;q.fail=false});
 if(MODE!=="live")save();buzz(30);if(msg)toast(msg);render();ops.forEach(o=>sqSend(o.table+":"+o.row.id));return true}
window.sqRetry=()=>{sqKeys().forEach(k=>{const q=SQ[k];if(q.fail){q.fail=false;q.tries=0;sqSend(k)}})};
window.addEventListener("beforeunload",e=>{if(sqKeys().length){e.preventDefault();e.returnValue="保存できていない変更があります"}});

  document.body.classList.add("aibusy");if(!bar){bar=document.createElement("div");bar.id="aiBar";bar.className="aibar";lb.appendChild(bar)}
  const up=()=>{const s=Math.round((Date.now()-AI_T0)/1000);bar.innerHTML=`<span class="pp" aria-hidden="true" style="background-image:var(--pp-wow)"></span><b>アスポッピー考え中…</b> ${esc(AI_TX)}（${s}秒）${s>=30?" ・ もう少しかかります…":""}`};up();clearInterval(AI_IV);AI_IV=setInterval(up,1000)}
 else{clearInterval(AI_IV);document.body.classList.remove("aibusy");if(bar)bar.remove()}}
{const _a0=api;api=async function(action,payload){if(action!=="json")return _a0(action,payload);aiBusy(1,payload);try{return await _a0(action,payload)}finally{aiBusy(-1)}}}

 DB.recCutoff=d.recCutoff||"";if(d.now)SYNC_TS=new Date(new Date(d.now).getTime()-90000).toISOString()}

/* ===== 位置 ===== */
function dist(a,b,c,d){const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
 const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function nearest(){ if(!S.pos) return [];
 return DB.offices.filter(o=>o.lat!=null&&(ost(o)==="稼働"||(S.showAll&&ost(o)==="利用者なし")||S.showAll==="all")).map(o=>({o,d:dist(S.pos.lat,S.pos.lng,o.lat,o.lng)})).sort((a,b)=>a.d-b.d)}
function fmtD(m){return m<1000?Math.round(m)+" m":(m/1000).toFixed(1)+" km"}
function hereId(){const n=nearest()[0];return n&&n.d<=ARRIVE_M?n.o.id:null}
/* 入力中・入力途中の内容がある間は、画面を作り直さない */
function typing(){const a=document.activeElement;
 if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest("#app"))return true;
 return !!(S.cmEdit||S.calEditing||S.bulk||S.recOpen||($("#f-text")&&$("#f-text").value)||($("#f-trans")&&$("#f-trans").value))}
function onPos(lat,lng,src){
 try{setTimeout(()=>lmNear(lat,lng),0)}catch(e){}
 const before=hereId(),first=!S.pos;
 S.pos={lat,lng,acc:(window.__lastAcc||null)}; S.gps=src;
 const n=nearest()[0];let opened=false;
 if(n && n.d<=ARRIVE_M && S.autoOpened!==n.o.id && S.view==="visit" && !S.recOpen && !S.cmEdit && !typing() && !RC.on && !RC.busy){S.autoOpened=n.o.id;S.office=n.o.id;S.view="visit";S.selCm=null;opened=true}
 if(n && n.d>ARRIVE_M*2 && S.autoOpened===n.o.id) S.autoOpened=null;
 renderGps();
 if(src==="sim"){render();return}
 if(typing()||SC.stage!=="idle"||RC.on)return;
 if(S.view==="list"&&S.listMode==="map"&&!opened)return;
 if(S.view==="umap"&&!opened)return;
 let moved=true;if(S.view==="list"&&!opened&&!first){const lp=S.lastListPos;moved=!lp||dist(lp.lat,lp.lng,lat,lng)>50}
 if(S.view==="list"&&moved)S.lastListPos={lat,lng};
 if(opened||first||(S.view==="list"&&moved)||(S.view==="visit"&&(!S.office||before!==hereId())))render();
}
function startGps(){
 if(!navigator.geolocation){S.gps="off";renderGps();return}
 try{navigator.geolocation.watchPosition(p=>{window.__lastAcc=p.coords.accuracy;onPos(p.coords.latitude,p.coords.longitude,"gps")},
   ()=>{if(S.gps!=="sim"){S.gps="off";renderGps()}},{enableHighAccuracy:true,maximumAge:15000,timeout:20000})}
 catch(e){S.gps="off"}
}

  hp.type="highpass";hp.frequency.value=500;

/* 続きの通話・面談：caselog に {case:"r:前の記録", kind:"続き", rec:この記録} で紐付けて、一覧では1つの流れにまとめる */

function recRoot(r){let x=r,seen={};for(let i=0;i<30;i++){const p=recParent(x);if(!p||seen[p])break;seen[p]=1;const pr=DB.records.find(y=>y.id===p);if(!pr)break;x=pr}return x}

 return [...g.values()].map(l=>l.sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.id).localeCompare(String(a.id)))).sort((a,b)=>String(b[0].date).localeCompare(String(a[0].date)))}

function isMine(o){const s=staffOf(o);if(!USER&&MODE==="demo")return s.includes(me());return !!USER&&staffHas(o,USER.email)}
function staffOf(o){return String(o.staff||"").split(",").map(x=>x.trim()).filter(Boolean).filter(e=>{const x=(DB.users||[]).find(v=>String(v.email||"").toLowerCase()===e.toLowerCase());return !x||!RETIRED_NM.some(n=>String(x.name||"").replace(/[\s　]/g,"").includes(n))})}
/* 担当の一致：メールの大文字小文字・名前で入っている場合も同じ人とみなす（11/12） */
function staffHas(o,em){const k=String(em||"").toLowerCase(),u=(DB.users||[]).find(v=>String(v.email||"").toLowerCase()===k),nm=u?String(u.name||"").replace(/[\s　]/g,""):"";
 return staffOf(o).some(x=>{const y=String(x).toLowerCase();return y===k||(nm&&String(x).replace(/[\s　]/g,"")===nm)})}
function uname(e){const u=DB.users.find(x=>x.email===e);return u?u.name:e}
function staffNames(o){const s=staffOf(o);return s.length?s.map(uname).join("・"):"未設定"}
function findUserByName(n){n=String(n||"").replace(/[\s　]/g,"");if(!n)return null;
 return DB.users.find(u=>u.email===n.toLowerCase()||u.name.replace(/[\s　]/g,"")===n)||DB.users.find(u=>u.name.replace(/[\s　]/g,"").startsWith(n))||null}
function staffForm(o){const s=staffOf(o);const names=[...new Set(DB.offices.flatMap(staffOf).filter(x=>!x.includes("@")))].filter(n=>!DB.users.some(u=>u.name===n));
 const opt=v=>`<option value="">（なし）</option>`+DB.users.map(u=>`<option value="${esc(u.email)}" ${u.email===v?"selected":""}>${esc(u.name)}</option>`).join("")+names.map(n=>`<option value="${esc(n)}" ${n===v?"selected":""}>${esc(n)}</option>`).join("");
 return `<form class="form" onsubmit="saveStaff(event,'${o.id}')" style="margin-top:8px">
  <div class="row2"><label>担当営業（主）<select id="st1">${opt(s[0]||"")}</select></label><label>2人目（2人体制のときだけ）<select id="st2">${opt(s[1]||"")}</select></label></div>
  <div style="display:flex;gap:8px"><button class="btn primary" type="submit">保存</button><button class="btn" type="button" onclick="S.staffEdit=false;render()">やめる</button></div></form>`}

const XL={stage:"idle",plan:null,err:""};
function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement("script");
 s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>rej(new Error("Excel読み込み部品を取得できません"));document.head.appendChild(s)})}
async function readSheetRows(file){
 if(/\.csv$/i.test(file.name)){const rows=parseCsv(decodeBuf(await file.arrayBuffer()).replace(/^﻿/,""));return rows}
 await loadXlsx();const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
 return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:false})}
function buildPlan(rows){
 const hi=rows.findIndex(r=>r.some(c=>/居宅名|事業所名/.test(String(c))));
 if(hi<0)throw new Error("1行目付近に「居宅名」の列が見つかりません");
 const h=rows[hi].map(x=>String(x).trim());const ix=(...ns)=>h.findIndex(x=>ns.some(n=>x.includes(n)));
 const I={office:ix("居宅名","事業所名"),name:ix("ケアマネ氏名","氏名","ケアマネ"),kana:ix("ふりがな","フリガナ","かな"),role:ix("役職"),years:ix("経験"),count:ix("担当件数","件数"),
  traits:ix("特徴"),note:ix("メモ","備考"),addr:ix("住所"),tel:ix("電話"),st1:h.findIndex(x=>/担当営業/.test(x)&&!/2|２|二/.test(x)),st2:h.findIndex(x=>/担当営業\s*[2２]|2人目/.test(x))};
 const g=(r,k)=>I[k]>=0?String(r[I[k]]??"").trim():"";
 const newOffices=[],newCms=[],skipped=[],staffSet={},unknownStaff=new Set();let matched=new Set();
 for(const r of rows.slice(hi+1)){const on=g(r,"office");if(!on||/記入例/.test(on))continue;
  let o=matchOffice(on)||newOffices.find(x=>norm(x.name)===norm(on));
  if(!o){o={id:newId("o"),name:on,addr:g(r,"addr")||"住所未登録",tel:g(r,"tel"),lat:null,lng:null,notices:[],staff:""};newOffices.push(o)}else if(!newOffices.includes(o))matched.add(o.id);
  ["st1","st2"].forEach(k=>{const n=g(r,k);if(!n)return;const u=findUserByName(n);if(!u){unknownStaff.add(n);return}
   (staffSet[o.id]=staffSet[o.id]||[]);if(!staffSet[o.id].includes(u.email))staffSet[o.id].push(u.email)});
  const nm=g(r,"name");if(!nm)continue;
  const key=nm.replace(/[\s　]/g,"");
  if(DB.cms.some(c=>c.office===o.id&&c.name.replace(/[\s　]/g,"")===key)||newCms.some(c=>c.office===o.id&&c.name.replace(/[\s　]/g,"")===key)){skipped.push(nm+"（"+o.name+"）");continue}
  const rl=g(r,"role");
  newCms.push({id:newId("c"),office:o.id,name:nm,kana:g(r,"kana"),role:/主任/.test(rl)?"主任CM":/管理/.test(rl)?"管理者":(rl||"CM"),years:g(r,"years"),
   count:g(r,"count")===""?null:Number(g(r,"count").replace(/[^0-9]/g,""))||null,traits:g(r,"traits").split(/[、,]/).map(x=>x.trim()).filter(Boolean),note:g(r,"note"),likes:"",_office:o.name})}
 const staffOps=[];
 Object.keys(staffSet).forEach(id=>{const v=staffSet[id].slice(0,2).join(",");const no=newOffices.find(x=>x.id===id);
  if(no)no.staff=v;else{const ex=DB.offices.find(x=>x.id===id);if(ex&&String(ex.staff||"")!==v)staffOps.push({id,staff:v,_name:ex.name})}});
 return {newOffices,newCms,skipped,matched:matched.size,staffOps,unknownStaff:[...unknownStaff]}}

/* ===== 利用者Excel一括登録（氏名は端末内で匿名化） ===== */
const CL={stage:"idle",rows:null,map:{},fmt:"raw",err:""};
function toHira(k){return String(k||"").normalize("NFKC").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).trim()}
function kanaInitial(k){const c=toHira(k)[0];if(!c)return "";
 const T=[["あ","A"],["い","I"],["う","U"],["え","E"],["お","O"],["かきくけこ","K"],["がぎぐげご","G"],["さすせそ","S"],["し","S"],["ざずぜぞ","Z"],["じぢ","J"],["たてと","T"],["ち","C"],["つ","T"],["だづでど","D"],["なにぬねの","N"],["はひへほ","H"],["ふ","F"],["ばびぶべぼ","B"],["ぱぴぷぺぽ","P"],["まみむめも","M"],["やゆよ","Y"],["らりるれろ","R"],["わを","W"],["ゔ","V"]];
 for(const [a,l] of T)if(a.includes(c))return l;return /[a-z]/i.test(c)?c.toUpperCase():""}
function splitName(n){n=String(n||"").normalize("NFKC").trim();const p=n.split(/\s+/);
 if(p.length>=2)return [p[0],p.slice(1).join("")];return n.length>=3?[n.slice(0,2),n.slice(2)]:[n.slice(0,1),n.slice(1)]}
/* 加藤 恭子（カトウ キョウコ）→ K藤 恭子 ／ 姓のみ → K藤 */
function maskName(full,kana,fmt){if(fmt==="raw")return String(full||"").normalize("NFKC").trim().replace(/\s+/g," ");const [sei,mei]=splitName(full);const kp=toHira(kana).split(/\s+/);
 const ini=kanaInitial(kp[0]||kana)||"〇";const ms=ini+sei.slice(1);return fmt==="sei"||!mei?ms:ms+" "+mei}
function townOf(a){let s=String(a||"").normalize("NFKC").replace(/\s/g,"");if(!s)return "";
 s=s.replace(/大字/g,"").replace(/^.*?[都道府県]/,"").replace(/^.*?郡/,"").replace(/^.*?市/,"").replace(/^.*?区/,"");
 const m=s.match(/^[^0-9\-−ー－]+/);return m?m[0].replace(/(丁目|番地|番|号)$/,""):""}
function dice(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a.includes(b)||b.includes(a))return 0.9+Math.min(a.length,b.length)/Math.max(a.length,b.length)/10;
 const bg=s=>{const r=[];for(let i=0;i<s.length-1;i++)r.push(s.slice(i,i+2));return r};const x=bg(a),y=bg(b);let n=0;const yy=y.slice();
 x.forEach(t=>{const i=yy.indexOf(t);if(i>=0){n++;yy.splice(i,1)}});return x.length+y.length?2*n/(x.length+y.length):0}
function guessOffice(raw){let best=null,sc=0;DB.offices.forEach(o=>{const d=dice(raw,o.name);if(d>sc){sc=d;best=o}});return sc>=0.45?best:null}
function statusOf(t){t=String(t||"");return /入院|入所|要注意|中止/.test(t)?"alert":/フォロー|検討|見積|注意/.test(t)?"warn":"ok"}
async function readClients(file){const rows=await readSheetRows(file);
 const hi=rows.findIndex(r=>r.some(c=>/利用者|氏名|顧客/.test(String(c))));if(hi<0)throw new Error("「利用者氏名」の列が見つかりません");
 const h=rows[hi].map(x=>String(x).trim());const ix=(...ns)=>h.findIndex(x=>ns.some(n=>x.includes(n)));
 const I={office:ix("居宅","事業所"),name:h.findIndex(x=>/利用者|氏名|顧客/.test(x)&&!/カナ|かな|ﾌﾘｶﾞﾅ|フリガナ|ケアマネ/.test(x)),kana:ix("フリガナ","ふりがな","カナ","ｶﾅ"),addr:ix("住所"),
  cm:ix("ケアマネ","CM"),lv:ix("介護度","要介護"),items:ix("用具","品目","商品"),status:ix("状態"),recent:ix("近況","メモ","備考")};
 if(I.name<0)throw new Error("「利用者氏名」の列が見つかりません");

function parseCsv(t){const rows=[];let row=[],f="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){row.push(f);f=""}
  else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
  else f+=c}
 if(f||row.length){row.push(f);rows.push(row)}return rows}
function decodeBuf(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){return new TextDecoder("shift_jis").decode(buf)}}
function csvToOffices(text){
 const rows=parseCsv(text.replace(/^﻿/,""));const h=rows[0].map(x=>x.trim());
 const ix=n=>h.findIndex(x=>x===n||x.includes(n));
 const I={city:ix("市区町村名"),name:ix("事業所名"),kana:ix("事業所名カナ"),addr:ix("住所"),bldg:ix("方書"),lat:ix("緯度"),lng:ix("経度"),tel:ix("電話番号"),corp:ix("法人の名称"),code:ix("事業所番号"),url:ix("URL")};
 if(I.name<0||I.addr<0)throw new Error("居宅介護支援のCSVではないようです（事業所名・住所の列が見つかりません）");
 const out=[];
 for(const r of rows.slice(1)){const city=r[I.city]||"",addr=r[I.addr]||"";
  if(!(city.includes("福山市")||addr.includes("福山市")))continue;
  out.push({code:r[I.code]||"",name:(r[I.name]||"").trim(),kana:r[I.kana]||"",addr:(addr+(r[I.bldg]?" "+r[I.bldg]:"")).trim(),
   lat:parseFloat(r[I.lat])||null,lng:parseFloat(r[I.lng])||null,tel:r[I.tel]||"",corp:r[I.corp]||"",url:r[I.url]||""})}
 return out}
function mergeOffices(list,drop){
 if(drop){const dummy=DB.offices.filter(o=>/^o\d$/.test(o.id)).map(o=>o.id);
  const dcm=DB.cms.filter(c=>dummy.includes(c.office)).map(c=>c.id);
  DB.offices=DB.offices.filter(o=>!dummy.includes(o.id));DB.cms=DB.cms.filter(c=>!dcm.includes(c.id));
  DB.clients=DB.clients.filter(u=>!dcm.includes(u.cm));DB.records=DB.records.filter(r=>!dummy.includes(r.office));
  DB.cards.forEach(c=>{if(dcm.includes(c.cm))c.cm=""});if(dummy.includes(S.office))S.office=null}
 let add=0,upd=0;
 for(const x of list){
  let o=DB.offices.find(o=>x.code&&o.code===x.code);
  if(!o){const n=norm(x.name);o=n.length>=3?DB.offices.find(o=>!o.code&&(norm(o.name)===n||norm(o.name).includes(n)||n.includes(norm(o.name)))):null}
  if(o){Object.assign(o,{code:x.code||o.code,kana:x.kana,addr:x.addr,tel:x.tel||o.tel,corp:x.corp,url:x.url});if(x.lat){o.lat=x.lat;o.lng=x.lng}upd++}
  else{DB.offices.push({id:"k"+(x.code||Date.now()+"_"+add),code:x.code,name:x.name,kana:x.kana,addr:x.addr,tel:x.tel,corp:x.corp,url:x.url,lat:x.lat,lng:x.lng,notices:[]});add++}
 }
 DB.importedAt=new Date().toLocaleString("ja-JP");save();fillSim();
 return `福山市の居宅 ${list.length}件を取り込みました（新規${add}件・更新${upd}件）`}

 try{({blob,url}=await shrink(f,1600))}
 catch(e){SC.stage="confirm";SC.photo="";SC.fields=Object.assign({},EMPTY_F);
  SC.err="写真を開けませんでした（形式："+(f.type||"不明")+"）。iPhoneの場合はカメラ設定を「互換性優先」にしてください。";renderScan();return}

const CARD_PROMPT=`これは日本の介護業界（居宅介護支援事業所など）の名刺の写真です。傾きや縦書き、ロゴ・顔写真に注意して、記載内容を一字ずつ正確に読み取り、次のキーだけを持つJSONで返してください。読めない項目は空文字。
{"name":"氏名（姓と名の間に半角スペース）","kana":"ふりがな（ひらがな。記載がなければ空）","org":"事業所名（法人名ではなく居宅介護支援事業所などの事業所名を優先）","title":"役職・資格（例：主任介護支援専門員）","addr":"事業所の住所","tel":"電話番号（携帯より事業所の固定電話を優先）","email":"メールアドレス","kind":"居宅介護支援事業所・地域包括支援センターのケアマネジャーなら kyotaku、それ以外のサービス事業所（デイサービス、訪問介護、訪問看護、福祉用具、施設など）なら service","stype":"kind が service のとき、サービスの種類（例：デイサービス、訪問介護、訪問看護）。kyotaku なら空"}`;
async function processCard(blob,url){
 SC.stage="reading";SC.photo=url;SC.err="";SC.msg="名刺を読み取り中…";renderScan();
 let fields=null,route="";
 try{
  const r=await aiJson(CARD_PROMPT,blob,m=>{SC.msg=m;renderScan()});
  if(r){fields=r.data;route=r.route}
  else SC.err="この画面ではAI読み取りが使えません。手で入力して登録できます。";
 }catch(e){SC.err="自動で読み取れませんでした（"+(e.route||route||"AI")+"）："+errText(e)+"。手で入力して登録できます。"}
 SC.fields=Object.assign({},EMPTY_F,fields||{});SC.kind=SC.fields.kind==="service"?"service":"kyotaku";SC.place="";SC.pnote="";
 SC.stage="confirm";SC.route=route;renderScan();
}
function errText(e){return {auth:"ログインが必要です",not_allowed:"このGoogleアカウントは登録されていません。管理者に追加を依頼してください",bad_login:"Googleログインを確認できませんでした。もう一度お試しください",forbidden:"この操作は管理者だけができます",not_granted:"AIの利用が許可されていません。もう一度試すと許可の確認が出ます",rate_limited:"AIが混み合っています。少し待って再度お試しください",invalid_json:"AIの返答を読み取れませんでした。もう一度お試しください",bad_token:"合言葉が違います（設定を確認）",no_key:"GAS側にAPIキーが設定されていません",network:"GASに接続できません（URLと通信を確認）"}[e.code]||e.message||e.code||"不明なエラー"}

/* ===== AIの呼び先：デモはClaude画面上のAI、本番はGAS経由（Gemini/Claude API） ===== */
function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function aiJson(prompt,blob,onMsg){
 if(MODE==="live"){onMsg&&onMsg("AIで読み取り中…（5〜15秒）");
  return {route:"GAS",data:await api("json",{prompt,image:blob?await b64(blob):null,mime:blob?(blob.type||"image/jpeg").split(";")[0]:null})}}
 const ai=await getSample();
 if(ai){let canImg=true;
  if(blob){try{const lim=await ai.limits();canImg=!!(lim&&lim.images)}catch(e){canImg=false}}
  if(canImg){onMsg&&onMsg("AIで読み取り中…（初回は許可の確認が出ます）");
   try{return {route:"Claude",data:await ai.json(prompt,blob?{images:blob}:{modelTier:"quick"})}}catch(e){e.route="Claude";throw e}}
 }
 return null;
}

let _sample;
function getSample(){if(_sample!==undefined)return Promise.resolve(_sample);
 if(!window.claude||!window.claude.use){_sample=null;return Promise.resolve(null)}
 return window.claude.use("sample").then(s=>(_sample=s||null)).catch(()=>(_sample=null))}

/* ===== 録音・文字起こし・要約 ===== */
const RC={on:false,rec:null,sr:null,stream:null,finalText:"",audioUrl:"",t0:0,timer:null,q:Promise.resolve(),busy:0,fail:[],msg:""};
window.toggleRec=async()=>{RC.on?stopRec():startRec()};
async function startRec(){
 const st=()=>$("#recState");
 try{RC.stream=await navigator.mediaDevices.getUserMedia({audio:true})}
 catch(e){const s=st();if(s)s.innerHTML=`<span class="warnTxt">マイクが使えません。</span>Claudeの画面上ではマイクが制限されています。サーバーに置いた版をスマホ・iPadで開くと録音できます。ここでは下の欄に文字起こしを貼り付けて要約を試せます。`;return}
 beep(SND.recStart);buzz(450);flash("● 録音開始","rec");
 RC.on=true;RC.finalText=RF.trans?RF.trans.replace(/\s+$/,"")+"\n":"";
 const chunks=[],seg=newId("g");let ci=0;if(!RF.did)RF.did=newId("d");RF.segs=(RF.segs||[]).concat(seg);draftSave();wlOn();
 try{const rec=new MediaRecorder(RC.stream);RC.rec=rec;
  rec.ondataavailable=e=>{chunks.push(e.data);if(e.data&&e.data.size)rdbPut({seg,i:ci++,at:Date.now(),mime:rec.mimeType||"audio/webm",blob:e.data})};   /* 10秒ごとに端末へ保存（途中で画面が落ちても残る） */
  rec.onstop=()=>{const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});RC.blob=blob;RC.audioUrl=URL.createObjectURL(blob);const a=$("#recAudio");if(a){a.src=RC.audioUrl;a.hidden=false}
   if(MODE==="live"&&blob.size>1000)transSeg(blob,seg)};rec.start(10000)}catch(e){}
 const SR=MODE==="live"?null:(window.SpeechRecognition||window.webkitSpeechRecognition);   /* 本番は録音をAIで文字起こし（スマホの「ピロン」音が鳴らない） */
 if(SR){const sr=new SR();sr.lang="ja-JP";sr.continuous=true;sr.interimResults=true;
  sr.onresult=ev=>{let interim="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];
    if(r.isFinal)RC.finalText+=r[0].transcript+"。\n";else interim+=r[0].transcript}
   setF("trans",RC.finalText+interim)};
  sr.onend=()=>{if(RC.on)try{sr.start()}catch(e){}};sr.onerror=()=>{};RC.sr=sr;try{sr.start()}catch(e){}}
 RC.t0=Date.now();recBarUpd();RC.timer=setInterval(()=>{recBarUpd();const s=Math.floor((Date.now()-RC.t0)/1000),el=st();if(!el)return;
  el.innerHTML=`<span class="recdot"></span>録音中 <span class="num">${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}</span>${SR?" ・ 文字起こし中":MODE==="live"?" ・ 止めると自動で文字起こしして下に足します":" ・ この端末は自動文字起こし非対応"}`},500);
 const b=$("#recBtn");if(b){b.classList.add("rec");b.textContent="■ 録音を止める"}
}
function stopRec(){const wasOn=RC.on;RC.on=false;clearInterval(RC.timer);wlOff();recBarUpd();draftSoon();if(wasOn){beep(SND.recStop);buzz([120,100,120,100,700]);flash("■ 録音終了","stop")}
 try{RC.sr&&RC.sr.stop()}catch(e){} try{RC.rec&&RC.rec.state!=="inactive"&&RC.rec.stop()}catch(e){}
 RC.stream&&RC.stream.getTracks().forEach(t=>t.stop());
 const b=$("#recBtn");if(b){b.classList.remove("rec");b.textContent="● 録音を開始"}
 RC.msg=MODE==="live"?"録音を止めました。文字起こしして下の欄に足します。":"録音を止めました。「AIで要約」を押すと、話した内容と次回アクションに入ります。";showRecMsg()}
/* 止めた録音は1本ずつ自動で文字起こしして、文字起こし欄の後ろに足す（次の録音で前の分が消えない） */
function transSeg(blob,seg){RC.busy++;showRecMsg();
 RC.q=RC.q.then(async()=>{try{const rr=await aiJson(`福祉用具貸与事業所の営業担当と、居宅介護支援事業所のケアマネジャーとの会話の録音です。日本語で文字起こしして、次のキーだけのJSONで返してください。
{"trans":"会話の文字起こし（話者が変わるごとに改行）"}
利用者の名前は聞き取れたとおりに書くこと。`,blob);
   const tx=rr&&rr.data&&rr.data.trans?String(rr.data.trans).trim():"";
   if(tx){setF("trans",(RF.trans&&RF.trans.trim()?RF.trans.replace(/\s+$/,"")+"\n":"")+tx);if(seg){RF.done=(RF.done||[]).concat(seg);draftSave()}}else RC.fail.push({blob,seg})}
  catch(e){RC.fail.push({blob,seg})}finally{RC.busy--;showRecMsg()}})}
function showRecMsg(){if(RC.on)return;
 if(RC.busy)RC.msg="録音を文字起こし中…（そのまま次の録音もできます）";
 else if(RC.fail.length)RC.msg=`文字起こしできなかった録音が${RC.fail.length}本あります。「AIで要約」を押すと、もう一度試します。`;
 else if(MODE==="live"&&RF.trans)RC.msg="文字起こしを下の欄に足しました。続けて録音するか、「AIで要約」を押してください。";
 const el=$("#recState");if(el)el.innerHTML=(RC.busy?'<span class="spin"></span>':"")+esc(RC.msg)}
window.summarize=async(btn)=>{RC.found=null;if(RC.on){stopRec();await new Promise(r=>setTimeout(r,800))}
 const stx=h=>{const el=$("#recState");if(el)el.innerHTML=h};
 if(btn)btn.disabled=true;
 if(RC.busy){stx('<span class="spin"></span>録音の文字起こしが終わるのを待っています…');await RC.q}
 if(RC.fail.length){const f=RC.fail.splice(0);f.forEach(x=>transSeg(x.blob,x.seg));stx('<span class="spin"></span>文字起こしをやり直しています…');await RC.q}
 const tr=String(RF.trans||"").trim();
 if(!tr){stx(RC.fail.length?"文字起こしできませんでした。もう一度「AIで要約」を押してください。":"録音するか、文字起こし欄に文字を貼り付けてください。");if(btn)btn.disabled=false;return}
 const o=DB.offices.find(x=>x.id===S.office);const cmName=(DB.cms.find(c=>c.id===RF.cm)||{}).name||"";
 const names=DB.clients.filter(u=>DB.cms.some(c=>c.id===u.cm&&c.office===o.id)).map(u=>u.name).join("、");
 stx('<span class="spin"></span>要約中…');
 try{const rr=await aiJson(
 `福祉用具貸与事業所（アスポート）の営業担当が、${RF.party==="利用者"?"利用者（"+((clientOf(RF.client)||{}).name||RF.cname||"")+"様）またはそのご家族":RF.party==="その他"?"居宅介護支援事業所「"+o.name+"」の関係者":"居宅介護支援事業所「"+o.name+"」のケアマネジャー（"+cmName+"）"}と面談したときの文字起こしです。音声認識のため誤字があります。
営業日報向けに要約し、次のキーだけのJSONで返してください。
{"summary":"話した内容の要約（箇条書き風に3〜6行、改行区切り、各行は「・」で始める）","next":"次回アクション（営業がやること。期限があれば含める。1〜2行）","clients":["話題に出た利用者名"]${FIND_KEYS}}${FIND_RULE(RF.date||today())}
参考：この居宅の当社利用者は ${names||"なし"}。${contTxt(RC.cands=contCands(o.id,""))}
--- 文字起こし ---
${tr.slice(0,20000)}`);
  if(!rr){stx("この画面ではAI要約が使えません。");if(btn)btn.disabled=false;return}
  const r=rr.data||{};RC.found={events:r.events,requests:r.requests,cases:r.cases};RC.cont=r.cont;
  setF("text",r.summary||"");setF("next",r.next||"");
  RC.msg="要約を入れました。確認して「記録を保存」を押してください。"+(r.clients&&r.clients.length?"（話題の利用者："+r.clients.join("、")+"）":"");stx(esc(RC.msg));
 }catch(e){stx("要約できませんでした："+esc(errText(e)))}
 if(btn)btn.disabled=false;};
