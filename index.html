<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>居宅営業管理システム</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d6e62">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
</head><body>
<style>
/* Layout: 上部に現在地バー、中央に居宅カルテ（CMカード→利用者→記録）、下部に固定タブ。iPadでは2列。 */
:root{
  --todo:#c75000; --todo-soft:#fdebd8;
  --bg:#f3f5f4; --surface:#ffffff; --line:#d9dfdc; --ink:#1c2826; --muted:#5d6c68;
  --accent:#0d6e62; --accent-soft:#dcefeb; --notice:#9a5b00; --notice-soft:#fbefd9;
  --alert:#b3261e; --alert-soft:#f9e1de;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --todo:#f5a142; --todo-soft:#3b2812;
  --bg:#121816; --surface:#1b2321; --line:#2e3a37; --ink:#e4ece9; --muted:#9aaba6;
  --accent:#4cc2b1; --accent-soft:#16332e; --notice:#f0b458; --notice-soft:#3a2c14;
  --alert:#ff8a80; --alert-soft:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --todo:#f5a142; --todo-soft:#3b2812;
  --bg:#121816; --surface:#1b2321; --line:#2e3a37; --ink:#e4ece9; --muted:#9aaba6;
  --accent:#4cc2b1; --accent-soft:#16332e; --notice:#f0b458; --notice-soft:#3a2c14;
  --alert:#ff8a80; --alert-soft:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 110px}
body.wide .wrap{max-width:1500px}
.rt{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}.rt th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:700;padding:6px;border-bottom:2px solid var(--line);white-space:nowrap}.rt td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}.rt tr:hover td{background:var(--accent-soft);cursor:pointer}
.rtw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.ac{display:inline-block;border-radius:6px;padding:1px 7px;font-weight:700;font-size:12.5px}.ac.ok{color:#1e8449}.ac.na{color:var(--muted);font-weight:400}.ac.o{background:#fdebd8;color:#b35400}.ac.r{background:#fadbd8;color:#b03a2e}.ac.h{background:#f4ecf7;color:#8e44ad}.ac.w{color:var(--ink);font-weight:400}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.bcol{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}.bcol h3{font-size:17px;margin-bottom:6px}.bitem{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:6px 2px;font:inherit;color:inherit;cursor:pointer}.bitem:hover{background:var(--accent-soft)}
.tgl{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:700;min-width:70px}.tgl.on{border-color:#1e8449;background:#d5f5e3;color:#1e8449}
.num{font-variant-numeric:tabular-nums}

/* 現在地バー */
.locbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.locbar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.backbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.brand{font-family:var(--f-display);font-weight:700;font-size:16px;margin-right:auto}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pill.off .dot{background:var(--alert)}
select.sim{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;max-width:100%}

/* 到着バナー */
.arrive{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent);color:var(--surface);padding:12px 16px;border-radius:12px;margin:12px 0}
.arrive b{font-family:var(--f-display);font-size:17px}
.arrive .btn{background:var(--surface);color:var(--accent);border:0}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:active,.tab:active,.oitem:active{transform:scale(.96);filter:brightness(.9)}
.btn:disabled{opacity:.6}
.bkrow{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.bkrow.on{background:var(--alert-soft);border-color:var(--alert);color:var(--alert);font-weight:700}
.bkrow input{width:22px!important;height:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:700}.seg button.on{background:var(--accent);color:var(--surface)}
.flash{white-space:pre-line;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;background:var(--accent);color:#fff;font-size:26px;font-weight:700;padding:22px 30px;border-radius:18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);pointer-events:none;max-width:90vw}
.flash.rec{background:#c0392b}.flash.stop{background:#34495e}
#map{height:62vh;min-height:320px;border-radius:12px;border:1px solid var(--line);z-index:1}
.jk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.jk .form{gap:6px}

/* 居宅ヘッダ */
.ohead{padding:14px 0 6px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end}
.ohead h1{font-size:22px}
.meta{color:var(--muted);font-size:13px}
.section-t{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.section-t h2{font-size:16px}
.section-t .meta{margin-left:auto}
.section-t{flex-wrap:wrap}

/* 連絡事項 */
.notices{display:grid;gap:8px}
.notice{background:var(--notice-soft);border-left:4px solid var(--notice);padding:10px 12px;border-radius:6px}
.notice .from{font-size:12px;color:var(--notice);font-weight:700}

/* CM */
.cms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cm.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cm-top{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.cm h3{font-size:17px}
.kana{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:3px 8px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.last{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px}
.last .meta{font-size:11.5px}

/* 利用者 */
.clients{display:grid;gap:8px}
.client{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.client .nm{font-weight:700}
.status{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;align-self:start;white-space:nowrap}
.st-ok{background:var(--accent-soft);color:var(--accent)}
.st-warn{background:var(--notice-soft);color:var(--notice)}
.st-alert{background:var(--alert-soft);color:var(--alert)}
.client .recent{grid-column:1/-1;font-size:13.5px}
.client .items{grid-column:1/-1;font-size:12.5px;color:var(--muted)}

/* 記録フォーム */
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px;width:100%}
.form textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.log{display:grid;gap:8px}
.logi{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:17px;line-height:1.65}
.logi .meta{font-size:14px}

/* 一覧 */
.olist{display:grid;gap:8px}
.oitem{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.oitem .dist{margin-left:auto;font-weight:700;color:var(--accent);white-space:nowrap}
.oitem .t{min-width:0}
.oitem .t b{display:block;font-family:var(--f-display)}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--notice-soft);color:var(--notice);font-weight:700;margin-left:4px}

/* 名刺 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.bcard .ph{aspect-ratio:91/55;max-width:100%;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:12px}
.bcard .ph img{width:100%;height:100%;object-fit:cover}
.bcard .bd{padding:10px 12px;font-size:13.5px;display:grid;gap:2px}
.bcard .bd b{font-size:15.5px;font-family:var(--f-display)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px;font-size:15px}
.prev{max-width:260px;border-radius:8px;border:1px solid var(--line)}

/* タブ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:flex}.tabs-in .tab{flex:1 1 0;min-width:0;position:relative;white-space:nowrap;font-size:12px;letter-spacing:-.02em;padding-left:0;padding-right:0}.tabs-in .tab[hidden]{display:none}
.tbadge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--alert);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}
.tab{background:none;border:0;padding:10px 4px 12px;font-size:12.5px;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--accent);font-weight:700}
.empty{padding:30px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:9}
.scan{display:flex!important;flex-direction:row;align-items:center;gap:14px;padding:16px;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);color:var(--accent)!important;cursor:pointer}
.scan b{font-size:16px;font-family:var(--f-display)}
.progress{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.match{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.recbox{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.recbtn{color:var(--alert);border:2px solid var(--alert);background:var(--alert-soft)}
#recForm textarea,#recForm input,#recEdit textarea,#recEdit input{font-size:17px}#recForm textarea{min-height:110px}
.todo-box{background:var(--todo-soft);border:2px solid var(--todo);border-radius:10px;padding:10px 12px}.todo-box .from{color:var(--todo);font-weight:700;font-size:15px}
.done-box{background:var(--accent-soft);border:2px solid var(--accent);border-radius:10px;padding:10px 12px}.done-box .from{color:var(--accent);font-weight:700;font-size:15px}
.btn.todo{background:var(--todo);color:#fff;border-color:var(--todo);font-size:16px;padding:10px 20px}
.jreq{border:1px solid var(--line);border-left:5px solid var(--todo);background:var(--surface);border-radius:10px;padding:10px 12px}.jreq.st-doing{border-left-color:#2e86de}.jreq.st-done{border-left-color:var(--accent);opacity:.8}
.msg{background:var(--bg);border-radius:10px;padding:6px 10px;margin-top:6px;max-width:92%;font-size:16px;white-space:pre-wrap;justify-self:start}.msg.me{background:var(--accent-soft);justify-self:end}.thread{display:grid}.newb{color:var(--alert)}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ctile{display:grid;gap:4px;text-align:left;border:1px solid var(--line);border-left:6px solid var(--c);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer;width:100%}
.ctile .ct-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.ctile .ct-h b{font-size:17px}
.ct-type{font-size:12px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:1px 9px;white-space:nowrap}
.ct-bar{display:flex;gap:3px}.ct-bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.ct-bar i.on{background:var(--c)}
.ct-st{font-weight:700;color:var(--c);font-size:15px}.ct-next{font-size:15px}
.c-new{--c:#7f8c8d}.c-go{--c:#2e86de}.c-wait{--c:#c89200}.c-done{--c:#1e8449}
.ctile.over{border-color:var(--alert);box-shadow:inset 0 0 0 2px var(--alert)}.ovt{color:var(--alert);font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.steps button{border:2px solid var(--c);background:var(--surface);color:var(--c);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}.steps button.past{background:var(--bg);opacity:.75}.steps button.on{background:var(--c);color:#fff}
.log>*{min-width:0}.rrow{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 10px}.rrow>summary{cursor:pointer;list-style:none}.rrow>summary::-webkit-details-marker{display:none}
.rr1{font-size:16px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rrow[open] .rr1{display:none}.rrow[open]>summary{margin-bottom:6px}
.cchip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:4px;color:#fff;background:var(--c)}
.hospl{grid-column:1/-1;font-size:15px;font-weight:700;color:#8e44ad;background:#f4ecf7;border-radius:8px;padding:4px 8px}.hospl.soon{color:#fff;background:#8e44ad}.hospl.soon .meta{color:#fff}
.client.inhosp{border:2px solid #8e44ad}
.cbx{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;background:var(--surface);display:grid;gap:6px}
.rbox{display:flex;gap:6px;align-items:flex-end;margin-top:6px}.rbox textarea{flex:1;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
.recbtn.rec{background:var(--alert);color:var(--surface)}
#recBar{display:flex;gap:8px;align-items:center;background:var(--alert-soft);color:var(--alert);padding:6px 16px;border-top:1px solid var(--alert)}#recBar[hidden]{display:none}#recBar .grow{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#recBar b{white-space:nowrap}#recBar .btn{white-space:nowrap}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--alert);margin-right:6px}
@media (prefers-reduced-motion:no-preference){.recdot{animation:bl 1s infinite}}
@keyframes bl{50%{opacity:.25}}
.warnTxt{color:var(--alert);font-weight:700}
.trans{white-space:pre-wrap;font-size:16px;background:var(--bg);padding:8px;border-radius:6px;max-height:200px;overflow:auto}
.scan{width:100%;text-align:left;font:inherit}
.cam{position:fixed;inset:0;z-index:20;background:#000;color:#fff}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(88vw,calc(62vh*91/55));aspect-ratio:91/55;max-width:100%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.camtip{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 16px);text-align:center;font-size:14px;padding:0 16px;text-shadow:0 1px 3px #000}
.cambar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;justify-content:space-between;align-items:center}
.cbtn{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:9px 14px;font-size:14px;min-width:88px}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);background-clip:padding-box}
.cltab{border-collapse:collapse;font-size:13.5px;width:100%}.cltab th,.cltab td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}.cltab select{max-width:260px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.demo{font-size:11.5px;color:var(--muted);text-align:center;margin-top:28px}
@media (min-width:900px){
  .split{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
}
@media (prefers-reduced-motion:no-preference){.cm,.oitem{transition:border-color .15s}}
</style>

<header class="locbar">
  <div class="locbar-in">
    <button id="backBtn" class="backbtn" type="button" hidden onclick="history.back()">← 戻る</button>
    <button id="syncBtn" class="backbtn" type="button" hidden onclick="syncNow(true)" title="最新にする" aria-label="最新にする">↻</button>
    <div class="brand">居宅営業管理システム<small id="brandSub">アスポート 営業用</small></div>
    <button id="gpsPill" class="pill" type="button" onclick="S.gpsHelp=!S.gpsHelp;S.view='visit';S.office=null;render()"><span class="dot"></span><span id="gpsText">位置を確認中…</span></button>
    <select id="sim" class="sim" aria-label="位置を試す">
      <option value="">📍 位置を試す（デモ）</option>
    </select>
  </div>
  <div id="recBar" hidden></div>
</header>

<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="画面切替">
  <div class="tabs-in">

const KEY="kyotaku-proto-v1";
const clone=o=>JSON.parse(JSON.stringify(o));

if(MODE==="demo"){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}DB=d||clone(SEED);if(!DB.users)DB.users=clone(SEED.users);["calendar","items","dist","visits","contracts","jisseki","reqs","sched","msgs","cases","caselog","hosp","rentals"].forEach(k=>{if(!DB[k])DB[k]=[]});

/* ===== サーバー（GAS＋スプレッドシート）との通信 ===== */
let USER=null,SESSION=null;
try{SESSION=localStorage.getItem("kyotaku-s")}catch(e){}   /* ログインは30日保持（サーバー側で期限・利用停止を確認） */
async function api(action,payload){
 let res;
 try{res=await fetch(setupCfg().gasUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,session:SESSION},payload||{}))})}
 catch(e){throw {code:"network"}}
 let j;try{j=await res.json()}catch(e){throw {code:"network",message:"GASの応答が不正です（デプロイのアクセスを「全員」にしてください）"}}
 if(!j.ok){if(j.code==="auth"&&action!=="login")logout("ログインの有効期限が切れました。もう一度ログインしてください。");throw {code:j.code||"gas",message:j.error}}
 return j.data}
const num=v=>v===""||v==null||isNaN(+v)?null:+v;
function fromServer(t,r,notices){r=Object.assign({},r);
 if(t==="offices"){r.lat=num(r.lat);r.lng=num(r.lng);const ex=DB.offices.find(o=>o.id===r.id);
  r.notices=notices?notices.filter(n=>n.office===r.id&&String(n.active).toUpperCase()!=="FALSE"):(ex?ex.notices:[])}
 if(t==="cms"){r.traits=String(r.traits||"").split(/[、,]/).map(x=>x.trim()).filter(Boolean);r.count=num(r.count)}
 if(t==="records")r.date=String(r.date||"").slice(0,10);
 return r}
function toServer(t,r){r=Object.assign({},r);
 if(t==="offices")delete r.notices;
 if(t==="cms"&&r.traits!==undefined)r.traits=(r.traits||[]).join("、");
 if(t==="cards"&&r.photo&&String(r.photo).startsWith("data:")){r.photoData=r.photo.split(",")[1];delete r.photo}
 return r}
function applyOp(t,row){const arr=DB[t];const i=arr.findIndex(x=>x.id===row.id);
 if(i>=0)Object.assign(arr[i],row);else if(t==="cards")arr.unshift(row);else arr.push(row)}
/* 保存：デモはこの端末に、本番はスプレッドシートに */
async function persist(ops){
 if(MODE==="live"){let d;
  try{d=await api("batch",{ops:ops.map(o=>{const row=toServer(o.table,o.row),ex=Array.isArray(DB[o.table])?DB[o.table].find(x=>x.id===o.row.id):null;if(ex&&ex.updatedAt!=null)row._base=ex.updatedAt;return {table:o.table,row}})})}
  catch(e){if(e&&e.code==="conflict")syncNow(true);throw e}
  d.rows.forEach((r,i)=>{const v=fromServer(ops[i].table,r);if(ops[i].table==="records"){const ex=DB.records.find(x=>x.id===v.id);if(ex&&ex.trans&&!v.trans)v.trans=ex.trans;if(!v.trans&&ex&&ex.hasTrans)v.hasTrans=ex.hasTrans}applyOp(ops[i].table,v)});cacheSoon()}
 else{ops.forEach(o=>applyOp(o.table,o.row));save()}}
async function loadAll(){const d=await api("load");if(d.user)USER=d.user;
 DB.offices=d.offices.map(r=>fromServer("offices",r,d.notices||[]));
 DB.cms=d.cms.map(r=>fromServer("cms",r));DB.clients=d.clients;DB.records=d.records.map(r=>fromServer("records",r)).filter(r=>r.kind!=="削除");
 DB.cards=d.cards.slice().reverse();DB.importedAt=d.importedAt||"";DB.users=d.users||[];DB.calendar=d.calendar||[];
 ["items","dist","visits","contracts","jisseki","reqs","sched","msgs","cases","caselog","hosp","rentals"].forEach(k=>DB[k]=d[k]||[]);
 DB.recCutoff=d.recCutoff||"";if(d.now)SYNC_TS=new Date(new Date(d.now).getTime()-90000).toISOString()}
/* 前回のデータをこの端末に覚えておき、次に開いたときすぐ表示する（ログアウトで消す） */
const CKEY="kyotaku-c";
function cacheSave(){if(MODE!=="live"||!USER||!SESSION||S.bgLoad)return;try{const db=Object.assign({},DB,{records:DB.records.map(r=>r.trans?Object.assign({},r,{trans:"",hasTrans:"1"}):r)});localStorage.setItem(CKEY,JSON.stringify({s:SESSION.slice(-8),at:Date.now(),user:USER,db}))}catch(e){try{localStorage.removeItem(CKEY)}catch(e2){}}}
let CST=0;function cacheSoon(){if(MODE!=="live")return;clearTimeout(CST);CST=setTimeout(cacheSave,2000)}
function cacheLoad(){try{const c=JSON.parse(localStorage.getItem(CKEY)||"null");if(!c||!SESSION||c.s!==SESSION.slice(-8)||Date.now()-c.at>14*864e5)return null;return c}catch(e){return null}}

/* ===== Googleログイン ===== */
function initGis(){if(window.google&&google.accounts){gisReady();return}
 const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=gisReady;

function gisReady(){try{google.accounts.id.initialize({client_id:setupCfg().clientId,callback:onCredential,auto_select:true,cancel_on_tap_outside:false});

function renderGisButton(){const el=$("#gbtn");if(el&&window.google&&google.accounts&&google.accounts.id)google.accounts.id.renderButton(el,{theme:"outline",size:"large",text:"signin_with",locale:"ja",width:280})}
async function onCredential(resp){S.loginMsg="確認中…";render();
 try{const d=await api("login",{idToken:resp.credential});SESSION=d.session;try{localStorage.setItem("kyotaku-s",SESSION)}catch(e){}
  USER=d.user;S.loginMsg="";await boot()}
 catch(e){USER=null;S.loginMsg=errText(e);render()}}
async function boot(){const c=cacheLoad();
 if(c){Object.assign(DB,c.db);USER=c.user;S.loading=false;S.bgLoad=true;fillSim();restoreLast();setTimeout(checkShared,300);
  if(!DB.offices.some(o=>o.id===S.office))S.office=null;render()}
 else{S.loading=true;render()}
 try{await loadAll();S.loading=false;S.bgLoad=false;fillSim();cacheSave();
  if(!c){restoreLast();setTimeout(checkShared,300)}
  if(!DB.offices.some(o=>o.id===S.office))S.office=null;
  if(!c||!editingNow())render();else{const sb=$("#syncBtn");if(sb)sb.textContent="↻"}}
 catch(e){S.loading=false;S.bgLoad=false;
  if(c){if(e.code!=="auth"){toast("最新のデータを読み込めませんでした（前回の内容を表示中）");render()}return}
  if(e.code!=="auth")S.loginMsg="データを読み込めません："+errText(e);render()}}
window.logout=msg=>{const s=SESSION;SESSION=null;USER=null;S.bgLoad=false;try{localStorage.removeItem("kyotaku-s");localStorage.removeItem(CKEY);if(typeof msg!=="string"){localStorage.removeItem(DKEY);localStorage.removeItem(RKEY);rdbDel(()=>false)}}catch(e){}
 try{google.accounts.id.disableAutoSelect()}catch(e){}
 if(s&&typeof msg!=="string")fetch(setupCfg().gasUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"logout",session:s})}).catch(()=>{});
 DB={offices:[],cms:[],clients:[],records:[],cards:[],users:[],calendar:[],items:[],dist:[],visits:[],contracts:[],jisseki:[],reqs:[],sched:[],msgs:[],cases:[],caselog:[],hosp:[],rentals:[]};S.loginMsg=typeof msg==="string"?msg:"ログアウトしました。";render();initGis()};

const ARRIVE_M=150; // この距離以内で「到着」とみなす
const S={view:"visit",office:null,pos:null,gps:"wait",selCm:null,autoOpened:null,q:"",cmEdit:null,loginMsg:"",loading:false,mine:true,recOpen:false,listMode:"list"};
/* 表示の設定はこの端末に覚えておく（自分の担当だけ・利用者なしも表示など） */
const UIKEY="kyotaku-ui",UI_FIELDS=["mine","showAll","gap","listMode","sort"];
try{const u=JSON.parse(localStorage.getItem(UIKEY)||"{}");UI_FIELDS.forEach(k=>{if(k in u)S[k]=u[k]})}catch(e){}

/* ===== 位置 ===== */
function dist(a,b,c,d){const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
 const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function nearest(){ if(!S.pos) return [];
 return DB.offices.filter(o=>o.lat!=null&&(ost(o)==="稼働"||(S.showAll&&ost(o)==="利用者なし")||S.showAll==="all")).map(o=>({o,d:dist(S.pos.lat,S.pos.lng,o.lat,o.lng)})).sort((a,b)=>a.d-b.d)}
function fmtD(m){return m<1000?Math.round(m)+" m":(m/1000).toFixed(1)+" km"}
function hereId(){const n=nearest()[0];return n&&n.d<=ARRIVE_M?n.o.id:null}
/* 入力中・入力途中の内容がある間は、画面を作り直さない */
function typing(){const a=document.activeElement;
 if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest("#app"))return true;
 return !!(S.cmEdit||S.calEditing||S.bulk||S.recOpen||($("#f-text")&&$("#f-text").value)||($("#f-trans")&&$("#f-trans").value))}
function onPos(lat,lng,src){
 const before=hereId(),first=!S.pos;
 S.pos={lat,lng}; S.gps=src;
 const n=nearest()[0];let opened=false;
 if(n && n.d<=ARRIVE_M && S.autoOpened!==n.o.id && !typing() && !RC.on && !RC.busy){S.autoOpened=n.o.id;S.office=n.o.id;S.view="visit";S.selCm=null;opened=true}
 if(n && n.d>ARRIVE_M*2 && S.autoOpened===n.o.id) S.autoOpened=null;
 renderGps();
 if(src==="sim"){render();return}
 if(typing()||SC.stage!=="idle"||RC.on)return;
 if(S.view==="list"&&S.listMode==="map"&&!opened)return;
 let moved=true;if(S.view==="list"&&!opened&&!first){const lp=S.lastListPos;moved=!lp||dist(lp.lat,lp.lng,lat,lng)>50}
 if(S.view==="list"&&moved)S.lastListPos={lat,lng};
 if(opened||first||(S.view==="list"&&moved)||(S.view==="visit"&&(!S.office||before!==hereId())))render();
}
function startGps(){
 if(!navigator.geolocation){S.gps="off";renderGps();return}
 try{navigator.geolocation.watchPosition(p=>onPos(p.coords.latitude,p.coords.longitude,"gps"),
   ()=>{if(S.gps!=="sim"){S.gps="off";renderGps()}},{enableHighAccuracy:true,maximumAge:15000,timeout:20000})}
 catch(e){S.gps="off"}

  ${it.err?`<div class="notice">${esc(it.err)}</div>`:""}
  ${!o&&!(it.cc||[]).length&&!(it.oc||[]).length&&!it.err?`<div class="notice">${it.who?"「"+esc(it.who)+"」は登録と一致しませんでした。":"相手が分かりませんでした。"}居宅を選んでください。</div>`:""}
  ${candHtml(it,id=>`cbPickCm(${i},'${id}')`,id=>`cbPickOffice(${i},'${id}')`)}

  <label>${it.party==="利用者"?"担当居宅":"居宅"}<input list="cbOffices" value="${esc(o?o.name:"")}" placeholder="居宅名の一部を入れて候補から選ぶ" onchange="cbSetOffice(${i},this.value)"></label>
  <div class="row2"><label>話したケアマネ<select onchange="CB.items[${i}].cm=this.value"><option value="">AIが会話から判断</option>${cms.map(c=>`<option value="${c.id}" ${it.cm===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}<option value="none" ${it.cm==="none"?"selected":""}>CM不在・事業所のみ</option></select></label>
  <label>日付<input type="date" value="${esc(it.date)}" onchange="CB.items[${i}].date=this.value"></label></div></div>`}).join("");
 const left=CB.items.filter(x=>x.state!=="ok"),need=left.filter(x=>!x.office).length,done=n-left.length;
 return `<div class="form" id="callBatch" style="border-color:var(--accent)"><b>📞 通話録音をまとめて取り込む（${n}件${done?`・保存済み${done}件`:""}）</b>
 <div class="meta">居宅とケアマネを確認してから「まとめて保存」を押してください。AIで1件ずつ要約して保存します。</div>
 ${officeList("cbOffices")}
 <div class="log" style="margin:8px 0">${rows}</div>
 ${need?`<div class="notice">居宅を選んでいない録音が${need}件あります（選ぶまで保存できません。不要なものは「外す」）</div>`:""}
 <div style="display:flex;gap:8px;flex-wrap:wrap">${left.length?`<button class="btn primary" type="button" ${need?"disabled":""} onclick="cbRun()">まとめて保存（${left.length}件）</button>`:""}<button class="btn" type="button" onclick="CB.items=[];render()">${left.length?"やめる":"閉じる"}</button></div></div>`}
window.cbDrop=i=>{CB.items.splice(i,1);render()};
window.cbSetOffice=(i,v)=>{const it=CB.items[i],oc=officeCands(v);it.cm="";it.cc=[];
 if(oc.length===1)Object.assign(it,{office:oc[0].id,oc:[],err:""});
 else Object.assign(it,{office:"",oc,ocq:v,err:v&&!oc.length?"「"+v+"」に当てはまる居宅が見つかりませんでした":""});render()};
window.cbPickOffice=(i,id)=>{Object.assign(CB.items[i],{office:id,oc:[],cm:"",err:""});render()};
window.cbPickCm=(i,id)=>{const c=DB.cms.find(x=>x.id===id);if(!c)return;Object.assign(CB.items[i],{cm:id,cc:[],oc:[],office:c.office,err:""});render()};

 CB.run=true;let ok=0,ng=0;
 for(let i=0;i<CB.items.length;i++){const it=CB.items[i];if(it.state==="ok")continue;CB.i=i;render();

 if(!ng){CB.items=[];toast(ok+"件の電話の記録を保存しました")}else toast(ok+"件保存しました。"+ng+"件は取り込めませんでした（下に理由があります）");

/* 録音アプリの「共有」から届いたファイル（ホーム画面に追加したとき）。複数でも受け取る */
async function checkShared(){if(!/[?&]shared=1/.test(location.search))return;
 try{history.replaceState(history.state,"",location.pathname+location.hash)}catch(e){}
 try{const c=await caches.open("kyotaku-share");
  const ks=(await c.keys()).filter(r=>/shared-file/.test(r.url)).sort((a,b)=>a.url.localeCompare(b.url,undefined,{numeric:true}));if(!ks.length)return;
  const files=[];for(const k of ks){const res=await c.match(k);await c.delete(k);if(!res)continue;
   const name=decodeURIComponent(res.headers.get("x-name")||"通話.m4a"),blob=await res.blob();files.push(new File([blob],name,{type:blob.type||res.headers.get("content-type")||""}))}
  if(files.length)pickCall({files})}catch(e){toast("共有されたファイルを読み込めませんでした")}}

const snorm=s=>kata(String(s||"").normalize("NFKC").toLowerCase()).replace(/[\s・･,，、。.\-‐－（）()「」]/g,"");
function qTokens(q){const n=String(q||"").normalize("NFKC");const t=n.replace(SQ_STRIP," ").split(/\s+/).map(snorm).filter(Boolean);return t.length?t:[snorm(n)].filter(Boolean)}

function listRows(){
 const q=(S.lq||"").trim();
 let rows=S.pos?nearest().concat(DB.offices.filter(o=>o.lat==null).map(o=>({o,d:null}))):DB.offices.map(o=>({o,d:null}));

 else{if(S.mine)rows=rows.filter(r=>isMine(r.o));
 if(!S.showAll)rows=rows.filter(r=>ost(r.o)==="稼働");else rows=rows.filter(r=>!offGone(r.o)||S.showAll==="all");
 if(S.gap)rows=rows.filter(r=>{const l=lastVisit(r.o);return !l||daysSince(l)>=GAP_DAYS})}
 if(S.distf&&!q){const [st,id]=S.distf.split(":");const it=DB.items.find(i=>i.id===id);
  if(it)rows=rows.filter(r=>itemFor(it,r.o)&&((distOf(it,r.o)||{}).state==="配布済")===(st==="done"))}
 const so=S.sort||"near",ja=(a,b)=>String(a).localeCompare(String(b),"ja");
 if(so==="addr")rows.sort((a,b)=>ja(String(a.o.addr).replace(/^.*?福山市/,""),String(b.o.addr).replace(/^.*?福山市/,"")));

function toHira(k){return String(k||"").normalize("NFKC").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).trim()}
function kanaInitial(k){const c=toHira(k)[0];if(!c)return "";
 const T=[["あ","A"],["い","I"],["う","U"],["え","E"],["お","O"],["かきくけこ","K"],["がぎぐげご","G"],["さすせそ","S"],["し","S"],["ざずぜぞ","Z"],["じぢ","J"],["たてと","T"],["ち","C"],["つ","T"],["だづでど","D"],["なにぬねの","N"],["はひへほ","H"],["ふ","F"],["ばびぶべぼ","B"],["ぱぴぷぺぽ","P"],["まみむめも","M"],["やゆよ","Y"],["らりるれろ","R"],["わを","W"],["ゔ","V"]];

function splitName(n){n=String(n||"").normalize("NFKC").trim();const p=n.split(/\s+/);
 if(p.length>=2)return [p[0],p.slice(1).join("")];return n.length>=3?[n.slice(0,2),n.slice(2)]:[n.slice(0,1),n.slice(1)]}
/* 加藤 恭子（カトウ キョウコ）→ K藤 恭子 ／ 姓のみ → K藤 */
function maskName(full,kana,fmt){if(fmt==="raw")return String(full||"").normalize("NFKC").trim().replace(/\s+/g," ");const [sei,mei]=splitName(full);const kp=toHira(kana).split(/\s+/);

function townOf(a){let s=String(a||"").normalize("NFKC").replace(/\s/g,"");if(!s)return "";
 s=s.replace(/大字/g,"").replace(/^.*?[都道府県]/,"").replace(/^.*?郡/,"").replace(/^.*?市/,"").replace(/^.*?区/,"");
 const m=s.match(/^[^0-9\-−ー－]+/);return m?m[0].replace(/(丁目|番地|番|号)$/,""):""}
function dice(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a.includes(b)||b.includes(a))return 0.9+Math.min(a.length,b.length)/Math.max(a.length,b.length)/10;
 const bg=s=>{const r=[];for(let i=0;i<s.length-1;i++)r.push(s.slice(i,i+2));return r};const x=bg(a),y=bg(b);let n=0;const yy=y.slice();
 x.forEach(t=>{const i=yy.indexOf(t);if(i>=0){n++;yy.splice(i,1)}});return x.length+y.length?2*n/(x.length+y.length):0}

async function readClients(file){const rows=await readSheetRows(file);
 const hi=rows.findIndex(r=>r.some(c=>/利用者|氏名|顧客/.test(String(c))));if(hi<0)throw new Error("「利用者氏名」の列が見つかりません");
 const h=rows[hi].map(x=>String(x).trim());const ix=(...ns)=>h.findIndex(x=>ns.some(n=>x.includes(n)));
 const I={office:ix("居宅","事業所"),name:h.findIndex(x=>/利用者|氏名|顧客/.test(x)&&!/カナ|かな|ﾌﾘｶﾞﾅ|フリガナ|ケアマネ/.test(x)),kana:ix("フリガナ","ふりがな","カナ","ｶﾅ"),addr:ix("住所"),
  cm:ix("ケアマネ","CM"),lv:ix("介護度","要介護"),items:ix("用具","品目","商品"),status:ix("状態"),recent:ix("近況","メモ","備考")};
 if(I.name<0)throw new Error("「利用者氏名」の列が見つかりません");
 const g=(r,k)=>I[k]>=0?String(r[I[k]]??"").trim():"";
 return rows.slice(hi+1).filter(r=>g(r,"name")&&!/記入例/.test(g(r,"office")+g(r,"name"))).map(r=>({office:g(r,"office"),name:g(r,"name"),kana:g(r,"kana"),addr:g(r,"addr"),cm:g(r,"cm"),lv:g(r,"lv"),items:g(r,"items"),status:g(r,"status"),recent:g(r,"recent")}))}

  ex?upd++:add++;ops.push({table:"clients",row})}
 try{for(let i=0;i<ops.length;i+=200)await persist(ops.slice(i,i+200));
  CL.stage="idle";CL.rows=null;toast(`利用者 新規${add}名・更新${upd}名を登録しました${skip?"（"+skip+"名は居宅未選択のため省略）":""}`);render()}

/* ===== 居宅データ取込 ===== */
function parseCsv(t){const rows=[];let row=[],f="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){row.push(f);f=""}
  else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
  else f+=c}
 if(f||row.length){row.push(f);rows.push(row)}return rows}
function decodeBuf(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){return new TextDecoder("shift_jis").decode(buf)}}
function csvToOffices(text){
 const rows=parseCsv(text.replace(/^﻿/,""));const h=rows[0].map(x=>x.trim());
 const ix=n=>h.findIndex(x=>x===n||x.includes(n));
 const I={city:ix("市区町村名"),name:ix("事業所名"),kana:ix("事業所名カナ"),addr:ix("住所"),bldg:ix("方書"),lat:ix("緯度"),lng:ix("経度"),tel:ix("電話番号"),corp:ix("法人の名称"),code:ix("事業所番号"),url:ix("URL")};
 if(I.name<0||I.addr<0)throw new Error("居宅介護支援のCSVではないようです（事業所名・住所の列が見つかりません）");
 const out=[];
 for(const r of rows.slice(1)){const city=r[I.city]||"",addr=r[I.addr]||"";
  if(!(city.includes("福山市")||addr.includes("福山市")))continue;
  out.push({code:r[I.code]||"",name:(r[I.name]||"").trim(),kana:r[I.kana]||"",addr:(addr+(r[I.bldg]?" "+r[I.bldg]:"")).trim(),
   lat:parseFloat(r[I.lat])||null,lng:parseFloat(r[I.lng])||null,tel:r[I.tel]||"",corp:r[I.corp]||"",url:r[I.url]||""})}
 return out}
function mergeOffices(list,drop){
 if(drop){const dummy=DB.offices.filter(o=>/^o\d$/.test(o.id)).map(o=>o.id);
  const dcm=DB.cms.filter(c=>dummy.includes(c.office)).map(c=>c.id);
  DB.offices=DB.offices.filter(o=>!dummy.includes(o.id));DB.cms=DB.cms.filter(c=>!dcm.includes(c.id));
  DB.clients=DB.clients.filter(u=>!dcm.includes(u.cm));DB.records=DB.records.filter(r=>!dummy.includes(r.office));
  DB.cards.forEach(c=>{if(dcm.includes(c.cm))c.cm=""});if(dummy.includes(S.office))S.office=null}
 let add=0,upd=0;
 for(const x of list){
  let o=DB.offices.find(o=>x.code&&o.code===x.code);
  if(!o){const n=norm(x.name);o=n.length>=3?DB.offices.find(o=>!o.code&&(norm(o.name)===n||norm(o.name).includes(n)||n.includes(norm(o.name)))):null}
  if(o){Object.assign(o,{code:x.code||o.code,kana:x.kana,addr:x.addr,tel:x.tel||o.tel,corp:x.corp,url:x.url});if(x.lat){o.lat=x.lat;o.lng=x.lng}upd++}
  else{DB.offices.push({id:"k"+(x.code||Date.now()+"_"+add),code:x.code,name:x.name,kana:x.kana,addr:x.addr,tel:x.tel,corp:x.corp,url:x.url,lat:x.lat,lng:x.lng,notices:[]});add++}
 }
 DB.importedAt=new Date().toLocaleString("ja-JP");save();fillSim();
 return `福山市の居宅 ${list.length}件を取り込みました（新規${add}件・更新${upd}件）`}

 st.innerHTML='<span class="spin"></span>読み込み中…';

  let msg;
  if(MODE==="live"){const d=await api("mergeOffices",{list});await loadAll();fillSim();msg=`福山市の居宅 ${list.length}件を取り込みました（新規${d.add}件・更新${d.upd}件）`}

function shrink(file,W){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=rej;
 rd.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const s=Math.min(1,W/Math.max(img.width,img.height));
  const cv=document.createElement("canvas");cv.width=img.width*s;cv.height=img.height*s;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  cv.toBlob(b=>res({blob:b,url:cv.toDataURL("image/jpeg",0.72)}),"image/jpeg",0.85)};img.src=rd.result};rd.readAsDataURL(file)})}
window.scanCard=async inp=>{const f=inp.files[0];inp.value="";if(!f)return;

 try{({blob,url}=await shrink(f,1600))}

  SC.err="写真を開けませんでした（形式："+(f.type||"不明")+"）。iPhoneの場合はカメラ設定を「互換性優先」にしてください。";renderScan();return}
 processCard(blob,url);

function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function aiJson(prompt,blob,onMsg){
 if(MODE==="live"){onMsg&&onMsg("AIで読み取り中…（5〜15秒）");
  return {route:"GAS",data:await api("json",{prompt,image:blob?await b64(blob):null,mime:blob?(blob.type||"image/jpeg").split(";")[0]:null})}}
 const ai=await getSample();
 if(ai){let canImg=true;
  if(blob){try{const lim=await ai.limits();canImg=!!(lim&&lim.images)}catch(e){canImg=false}}

   try{return {route:"Claude",data:await ai.json(prompt,blob?{images:blob}:{modelTier:"quick"})}}catch(e){e.route="Claude";throw e}}
 }
 return null;
}

 catch(e){const s=st();if(s)s.innerHTML=`<span class="warnTxt">マイクが使えません。</span>Claudeの画面上ではマイクが制限されています。サーバーに置いた版をスマホ・iPadで開くと録音できます。ここでは下の欄に文字起こしを貼り付けて要約を試せます。`;return}
 beep(SND.recStart);buzz(450);flash("● 録音開始","rec");
 RC.on=true;RC.finalText=RF.trans?RF.trans.replace(/\s+$/,"")+"\n":"";
 const chunks=[],seg=newId("g");let ci=0;if(!RF.did)RF.did=newId("d");RF.segs=(RF.segs||[]).concat(seg);draftSave();wlOn();
 try{const rec=new MediaRecorder(RC.stream);RC.rec=rec;
  rec.ondataavailable=e=>{chunks.push(e.data);if(e.data&&e.data.size)rdbPut({seg,i:ci++,at:Date.now(),mime:rec.mimeType||"audio/webm",blob:e.data})};   /* 10秒ごとに端末へ保存（途中で画面が落ちても残る） */
  rec.onstop=()=>{const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});RC.blob=blob;RC.audioUrl=URL.createObjectURL(blob);const a=$("#recAudio");if(a){a.src=RC.audioUrl;a.hidden=false}
   if(MODE==="live"&&blob.size>1000)transSeg(blob,seg)};rec.start(10000)}catch(e){}

}

 try{const rr=await aiJson(

${tr.slice(0,20000)}`);

   <input type="file" id="xl-file" accept=".xlsx,.xls,.csv" onchange="pickExcel(this)" style="position:absolute;opacity:0;width:1px;height:1px">
  </div>
  <div class="meta">列名：<b>居宅名</b>（必須）・<b>ケアマネ氏名</b>・ふりがな・役職・経験年数・担当件数・特徴・メモ・住所・電話・<b>担当営業</b>・担当営業2</div>
  <div id="xl-area">${xlAreaHtml()}</div>
 </div>
 <div class="section-t"><h2>利用者をExcelで一括登録</h2></div>
 <div class="form">
  <div class="meta">顧客一覧のExcel（.xlsx）かCSVを選ぶと、居宅名を自動で照合し、「町名＋氏名」（例：引野町 加藤 恭子 様）で登録します（下で頭文字にもできます）。住所・フリガナは送信しません。</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
   <label class="btn primary" for="cl-file" style="display:inline-flex">利用者のExcelを選ぶ</label>
   <input type="file" id="cl-file" accept=".xlsx,.xls,.csv" onchange="pickClients(this)" style="position:absolute;opacity:0;width:1px;height:1px">
  </div>
  <div class="meta">列名：<b>居宅名</b>（大まかでOK）・<b>利用者氏名</b>・<b>フリガナ</b>・住所・担当ケアマネ・要介護度・利用中の用具・状態・近況</div>
  <div id="cl-area">${clAreaHtml()}</div>
 </div>
 <div class="section-t"><h2>福山市の居宅データを取り込む</h2></div>
 <div class="form">
  <div class="meta">厚生労働省「介護サービス情報公表システム」のオープンデータ（居宅介護支援・全国CSV、毎年6月末・12月末時点）から、福山市の事業所だけを取り込みます。住所・電話・位置（緯度経度）も入るので、到着時の自動表示にそのまま使えます。${imp?`<br>前回の取り込み：<span class="num">${esc(imp)}</span>`:""}</div>
  ${MODE==="demo"?`<label style="flex-direction:row;display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="imp-drop" style="width:auto" ${DB.offices.some(o=>/^o\d$/.test(o.id))?"checked":""}> ダミーの居宅（試作用）を削除して置き換える</label>`:""}
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   ${MODE==="live"?`<button class="btn primary" type="button" onclick="importViaGas(this)">自動で取り込む</button>`:""}
   <label class="btn" for="imp-file" style="display:inline-flex;color:var(--ink)">CSVファイルを選ぶ</label>
   <input type="file" id="imp-file" accept=".csv,text/csv" onchange="importCsvFile(this)" style="position:absolute;opacity:0;width:1px;height:1px">
  </div>
  <div id="imp-st" class="meta">CSVは <a href="https://www.mhlw.go.jp/stf/kaigo-kouhyou_opendata.html" target="_blank" rel="noopener">厚労省のオープンデータのページ</a> の「居宅介護支援」からダウンロードできます。</div>
 </div>`:""}`;
}
function viewLog(){markRead("sales");
 const recs=[...DB.records].sort((a,b)=>b.date.localeCompare(a.date));
const top=salesMsgs()+quickRec()+`<div style="margin:8px 0 4px">${foundBox()}${cbBox()}${CB.items.length?"":CI.stage!=="idle"&&!CI.office?callBox():callPickBtn()}</div>`;
 const todo=recs.filter(r=>r.next);
 return top+casesSection("")+reqList()+`<div class="section-t"><h2>会話の記録</h2><span class="meta">全${recs.length}件 ・ タップで全文</span></div>${MODE==="live"&&DB.recCutoff?`<div class="meta" style="margin:-4px 0 6px">直近6か月分を表示しています。それより前の記録は、各居宅の画面で見られます。</div>`:""}
 <div class="log">${recs.slice(0,S.recAll?9999:60).map(recRow).join("")}</div>${recs.length>60&&!S.recAll?`<button class="btn sm" type="button" style="margin-top:8px" onclick="S.recAll=true;render()">すべて表示（${recs.length}件）</button>`:""}
 ${todo.length?`<details style="margin-top:12px"><summary class="meta" style="cursor:pointer">記録に書いた次回アクション（${todo.length}件）</summary><div class="log" style="margin-top:6px">${todo.map(r=>`<div class="logi"><b>${esc(r.next)}</b><div class="meta">${esc((DB.offices.find(o=>o.id===r.office)||{name:""}).name)} ・ ${r.date}</div></div>`).join("")}</div></details>`:""}`;
}
window.reloadAll=async b=>{b.disabled=true;try{await loadAll();fillSim();cacheSave();toast("最新のデータにしました");render()}catch(e){b.disabled=false;toast("更新できませんでした："+errText(e))}};
window.resetDemo=b=>{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="もう一度押すと初期化します";return}
 DB=JSON.parse(JSON.stringify(SEED));save();fillSim();toast("初期データに戻しました");render();};

function viewSetup(){const c=setupCfg();
 return `<div class="form" style="max-width:560px;margin:24px auto">
  <h2 style="font-size:18px">初期設定</h2>
  <div class="meta">管理者から伝えられた2つの値を入れてください（この端末に1回だけ）。</div>
  <label>GASのURL（…/exec）<input id="s-url" value="${esc(c.gasUrl)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
  <label>GoogleログインのクライアントID<input id="s-cid" value="${esc(c.clientId)}" placeholder="…apps.googleusercontent.com"></label>
  <button class="btn primary" type="button" onclick="saveSetup()">保存してログインへ</button>
  <a class="meta" href="#demo" onclick="setTimeout(()=>location.reload(),0)">設定せずにデモ（ダミーデータ）で試す</a>
 </div>`}
window.saveSetup=()=>{const u=$("#s-url").value.trim(),c=$("#s-cid").value.trim();
 if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){toast("GASのURLは https://script.google.com/…/exec の形です");return}
 if(!/apps\.googleusercontent\.com$/.test(c)){toast("クライアントIDは …apps.googleusercontent.com で終わります");return}
 try{localStorage.setItem(SETKEY,JSON.stringify({gasUrl:u,clientId:c}))}catch(e){}
 MODE="live";initGis();render()};
function viewLogin(){
 return `<div class="form" style="max-width:420px;margin:32px auto;text-align:center;justify-items:center">
  <h2 style="font-size:19px">居宅営業管理システム</h2>
  <div class="meta">アスポートの営業用です。登録されたGoogleアカウントでログインしてください。</div>
  ${S.loading?`<div class="progress"><span class="spin"></span>データを読み込み中…</div>`:`<div id="gbtn" style="min-height:44px"></div>`}
  ${S.loginMsg?`<div class="${/確認中/.test(S.loginMsg)?"meta":"notice"}" style="text-align:left">${esc(S.loginMsg)}</div>`:""}
  <div class="meta" style="font-size:12px">ボタンが出ない場合は、LINEなどのアプリ内ではなく、ChromeまたはSafariで開いてください。</div>
 </div>`}
function render(){
 renderGps();
 const gated=MODE==="setup"||(MODE==="live"&&(!USER||S.loading));
 document.querySelector(".tabs").hidden=gated;sim.hidden=gated||MODE==="live";
 $("#brandSub").textContent=MODE==="demo"?"アスポート 営業用 ・ デモ（ダミーデータ）":USER?"アスポート 営業用 ・ "+USER.name:"アスポート 営業用";
 if(MODE==="setup"){$("#app").innerHTML=viewSetup();return}
 if(gated){$("#app").innerHTML=viewLogin();renderGisButton();return}
 document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.v===S.view));
 if((isJimu()||(JIMU_URL&&seeJimu()&&!S.jimuInit))&&["visit","cards","sched"].includes(S.view)){S.view="jimu";S.jimuInit=true}
 document.body.classList.toggle("wide",S.view==="jimu");
 if(S.view==="jimu"&&!seeJimu())S.view="visit";
 {const tj=$("#t-jimu");if(tj)tj.hidden=!seeJimu();["t-visit","t-cards","t-sched"].forEach(id=>{const t=$("#"+id);if(t)t.hidden=isJimu()})}
 document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.v===S.view));
 if(S.view==="case"&&!(DB.cases||[]).some(c=>c.id===S.caseId))S.view="log";
 document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.v===(S.view==="case"?"log":S.view)));
 const v={visit:viewVisit,list:viewList,cards:viewCards,log:viewLog,sched:viewSched,settings:viewSettings,jimu:viewJimu,case:viewCase}[S.view]();
 if(MAP&&!(S.view==="list"&&S.listMode==="map")){try{MAP.remove()}catch(e){}MAP=null}
 $("#app").innerHTML=(S.view==="visit"||S.view==="log"?pendBox():"")+v+(MODE==="demo"?`<p class="demo">デモ：表示中の事業所・人物・利用者はすべて架空です。入力内容はこの端末のブラウザ内にだけ保存されます。</p>`:`<p class="demo">データは会社のスプレッドシートに保存されます。すぐ開けるよう前回の内容と保存前の録音をこの端末に覚えています（ログアウトで消えます）。</p>`);
}
const _render=render;render=function(){_render();if(S.view==="list"&&S.listMode==="map"&&$("#map"))drawMap()};
/* スマホの「戻る」でアプリ内のひとつ前の画面に戻る（最初の画面では2回押すと終了） */
let NAV_LAST=null,NAV_POP=false,EXIT_AT=0,NAV_DEPTH=0;
const navKey=()=>S.view+"|"+(S.view==="visit"?(S.office||""):S.view==="case"?(S.caseId||""):"");
const _render2=render;render=function(){_render2();
 if(MODE==="setup"||(MODE==="live"&&(!USER||S.loading)))return;
 const k=navKey();
 try{if(NAV_LAST===null){history.replaceState({root:1},"");history.pushState({k,v:S.view,o:S.office,c:S.caseId},"")}
  else if(k!==NAV_LAST&&!NAV_POP){history.pushState({k,v:S.view,o:S.office,c:S.caseId},"");NAV_DEPTH++}}catch(e){}
 NAV_LAST=k;NAV_POP=false;saveLast();updBadges();if(S.view==="visit"&&S.office)recentAdd(S.office);recBarUpd();if(RF.office&&S.recOpen)draftSoon();const bb=$("#backBtn");if(bb)bb.hidden=NAV_DEPTH<1};
window.addEventListener("popstate",e=>{const st=e.state||{};
 if(st.root&&(RC.on||RC.busy)){toast("録音中です。止めてから閉じてください");try{history.pushState({k:NAV_LAST,v:S.view,o:S.office},"")}catch(err){}return}
 if(st.root){if(Date.now()-EXIT_AT<2500){history.back();return}EXIT_AT=Date.now();toast("もう一度「戻る」を押すと終了します");
  try{history.pushState({k:NAV_LAST,v:S.view,o:S.office},"")}catch(err){}return}
 if(!st.v)return;
 NAV_DEPTH=Math.max(0,NAV_DEPTH-1);NAV_POP=true;S.view=st.v;S.office=st.o||null;S.caseId=st.c||null;S.recOpen=false;S.cmEdit=null;S.bulk=false;
 if(S.view==="visit"&&S.office)S.autoOpened=S.office;render();scrollTo(0,0)});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{S.view=t.dataset.v;S.cmEdit=null;render();scrollTo(0,0)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList?.contains("cm"))e.target.click()});

const _render3=render;render=function(){_render3();try{wantOlder()}catch(e){}const sb=$("#syncBtn");if(sb){sb.hidden=!(MODE==="live"&&USER&&!S.loading);sb.textContent=S.bgLoad||SYNC_BUSY?"…":"↻"}};
/* 起動 */
startGps();
if(MODE==="demo"){S.office=DB.offices.some(o=>o.id==="o1")?"o1":null;render()}
else if(MODE==="live"){if(SESSION)boot();else{render();initGis()}}
else render();
setTimeout(()=>{if(S.gps==="wait"){S.gps="off";renderGps()}},6000);
</script>
